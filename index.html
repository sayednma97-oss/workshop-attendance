<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"

<title>NMA Attendance System</title>


<style>

/* =====================================================
   NMA COLOR THEME
===================================================== */

:root {

    --nma-blue: #0072bc;
    --nma-blue-dark: #00558f;
    --nma-blue-light: #18a4e8;

    --nma-orange: #f58220;

    --bg-main: #07111b;
    --bg-card: rgba(12, 25, 38, 0.86);

    --text-main: #f4f8fb;
    --text-secondary: #91a4b5;

    --border:
        rgba(24,164,232,0.18);

}


/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}


/* =====================================================
   BODY
===================================================== */

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: var(--text-main);

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;


    background:

        radial-gradient(
            circle at 10% 10%,
            rgba(0,114,188,0.20),
            transparent 32%
        ),

        radial-gradient(
            circle at 90% 90%,
            rgba(245,130,32,0.10),
            transparent 30%
        ),

        linear-gradient(
            145deg,
            #050b12,
            #091724 50%,
            #06101a
        );

}


/* =====================================================
   MAIN CARD
===================================================== */

.container {

    width: 100%;

    max-width: 520px;

    position: relative;

    padding: 30px;

    border-radius: 26px;

    background:
        linear-gradient(
            145deg,
            rgba(16,35,52,0.92),
            rgba(7,17,27,0.94)
        );

    border:
        1px solid
        rgba(24,164,232,0.18);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    box-shadow:

        0 30px 80px
        rgba(0,0,0,0.55),

        inset 0 1px 0
        rgba(255,255,255,0.04);

}


/* =====================================================
   TOP ACCENT
===================================================== */

.container::before {

    content: "";

    position: absolute;

    top: 0;
    left: 12%;
    right: 12%;

    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--nma-blue-light),
            var(--nma-orange),
            transparent
        );

    border-radius: 100%;

}


/* =====================================================
   SECRET ADMIN BUTTON
===================================================== */

#secretTrigger {

    position: absolute;

    top: 5px;
    right: 5px;

    width: 40px;
    height: 40px;

    border: none;

    background: transparent;

    opacity: 0;

    z-index: 50;

}


/* =====================================================
   LOGO
===================================================== */

.logo-container {

    text-align: center;

    margin-bottom: 15px;

}


/*
   NMA logo from the company website.

   If your hosting blocks external images,
   download the NMA logo and name it:

   nma-logo.png

   then change src to:

   src="nma-logo.png"
*/

.logo {

    width: 145px;

    max-width: 70%;

    height: auto;

    object-fit: contain;

    filter:
        drop-shadow(
            0 6px 16px
            rgba(0,114,188,0.25)
        );

}


/* =====================================================
   BRAND LINE
===================================================== */

.brand-line {

    width: 65px;

    height: 3px;

    margin: 8px auto 20px;

    border-radius: 10px;

    background:

        linear-gradient(
            90deg,
            var(--nma-blue),
            var(--nma-orange)
        );

}


/* =====================================================
   TITLE
===================================================== */

.title {

    text-align: center;

    font-size: 27px;

    font-weight: 800;

    margin-bottom: 6px;

}


.subtitle {

    text-align: center;

    color:
        var(--text-secondary);

    font-size: 13px;

    margin-bottom: 27px;

}


/* =====================================================
   FORM
===================================================== */

.form-group {

    margin-bottom: 17px;

}


label {

    display: block;

    margin-bottom: 8px;

    color: #d9e5ee;

    font-size: 13px;

    font-weight: 700;

}


select,
input[type="text"],
input[type="password"] {

    width: 100%;

    padding: 14px 15px;

    border-radius: 13px;

    border:
        1px solid
        rgba(255,255,255,0.09);

    outline: none;

    background:
        rgba(255,255,255,0.045);

    color: white;

    font-size: 15px;

    transition:
        border 0.2s,
        box-shadow 0.2s,
        background 0.2s;

}


select:focus,
input[type="text"]:focus,
input[type="password"]:focus {

    border-color:
        rgba(24,164,232,0.65);

    background:
        rgba(255,255,255,0.065);

    box-shadow:
        0 0 0 3px
        rgba(0,114,188,0.10);

}


select option {

    background: #0b1722;

    color: white;

}


/* =====================================================
   EXTERNAL SITE
===================================================== */

#externalSiteGroup {

    display: none;

    animation:
        fadeIn 0.2s ease;

}


/* =====================================================
   SUBMIT
===================================================== */

.submit-btn {

    width: 100%;

    padding: 15px;

    margin-top: 6px;

    border: none;

    border-radius: 14px;

    cursor: pointer;

    font-size: 15px;

    font-weight: 800;

    color: white;

    background:

        linear-gradient(
            135deg,
            var(--nma-blue),
            var(--nma-blue-dark)
        );

    box-shadow:

        0 8px 25px
        rgba(0,114,188,0.20);

    transition:
        transform 0.2s,
        box-shadow 0.2s;

}


.submit-btn:hover {

    transform:
        translateY(-1px);

    box-shadow:

        0 12px 30px
        rgba(0,114,188,0.30);

}


.submit-btn:disabled {

    opacity: 0.55;

    cursor: not-allowed;

    transform: none;

}


/* =====================================================
   STATUS
===================================================== */

#status {

    display: none;

    margin-top: 16px;

    padding: 13px;

    border-radius: 12px;

    text-align: center;

    font-size: 13px;

    line-height: 1.5;

}


.status-info {

    display: block !important;

    color: #83d5ff;

    background:
        rgba(0,114,188,0.10);

    border:
        1px solid
        rgba(0,114,188,0.20);

}


.status-success {

    display: block !important;

    color: #7de2ff;

    background:
        rgba(0,150,220,0.10);

    border:
        1px solid
        rgba(0,150,220,0.20);

}


.status-error {

    display: block !important;

    color: #ff9b8c;

    background:
        rgba(220,55,40,0.10);

    border:
        1px solid
        rgba(220,55,40,0.20);

}


/* =====================================================
   ADMIN LOGIN
===================================================== */

.admin-login-box {

    margin-top: 18px;

    padding: 17px;

    border-radius: 17px;

    background:
        rgba(4,12,20,0.85);

    border:
        1px solid
        rgba(24,164,232,0.16);

    animation:
        fadeIn 0.25s ease;

}


.admin-login-title {

    margin-bottom: 12px;

    font-size: 14px;

    font-weight: 700;

    color: #dceaf4;

}


.admin-login-btn {

    width: 100%;

    margin-top: 10px;

    padding: 12px;

    border-radius: 11px;

    border:
        1px solid
        rgba(24,164,232,0.25);

    background:
        rgba(0,114,188,0.10);

    color:
        #63cfff;

    font-weight: 700;

    cursor: pointer;

}


.admin-error {

    margin-top: 8px;

    text-align: center;

    font-size: 12px;

    color: #ff8d84;

}


/* =====================================================
   ADMIN PANEL
===================================================== */

.admin-panel {

    margin-top: 18px;

    padding: 19px;

    border-radius: 18px;

    background:

        linear-gradient(
            145deg,
            rgba(15,35,52,0.97),
            rgba(5,15,24,0.97)
        );

    border:
        1px solid
        rgba(24,164,232,0.20);

    box-shadow:
        0 18px 40px
        rgba(0,0,0,0.30);

}


.admin-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

    margin-bottom: 5px;

}


.admin-title {

    margin: 0;

    font-size: 17px;

}


.admin-status {

    padding: 5px 8px;

    border-radius: 20px;

    font-size: 10px;

    font-weight: 800;

    color: #63cfff;

    background:
        rgba(0,114,188,0.10);

    border:
        1px solid
        rgba(0,114,188,0.20);

}


.admin-subtitle {

    margin-bottom: 15px;

    color: #71889b;

    font-size: 11px;

}


/* =====================================================
   ADMIN OPTIONS
===================================================== */

.admin-option {

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 12px;

    margin-bottom: 8px;

    border-radius: 11px;

    background:
        rgba(255,255,255,0.035);

    border:
        1px solid
        rgba(255,255,255,0.04);

    cursor: pointer;

    color: #d8e5ee;

    font-size: 12px;

}


.admin-option input {

    width: 17px;

    height: 17px;

    accent-color:
        var(--nma-blue);

}


/* =====================================================
   RESET
===================================================== */

.admin-reset {

    width: 100%;

    margin-top: 11px;

    padding: 12px;

    border-radius: 11px;

    border:
        1px solid
        rgba(245,130,32,0.25);

    background:
        rgba(245,130,32,0.07);

    color:
        #ffad6a;

    font-weight: 700;

    cursor: pointer;

}


/* =====================================================
   FOOTER
===================================================== */

.footer {

    margin-top: 18px;

    text-align: center;

    color: #536979;

    font-size: 10px;

}


/* =====================================================
   HIDDEN
===================================================== */

.hidden {

    display: none !important;

}


/* =====================================================
   ANIMATION
===================================================== */

@keyframes fadeIn {

    from {

        opacity: 0;

        transform:
            translateY(-5px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px) {

    body {

        padding: 12px;

    }


    .container {

        padding: 23px;

        border-radius: 22px;

    }


    .title {

        font-size: 24px;

    }


    .logo {

        width: 125px;

    }

}

</style>

</head>

<script>


/* =====================================================
   CONFIGURATION
===================================================== */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzl6_2uzwcejVTMWq0Zl96NBcBNVfAikgBdCi1Ak9Z9RdIST_wNupyrjt6tk8CxuW7E/exec";


const WORKSHOP_LAT =
30.228383;


const WORKSHOP_LNG =
31.743404;


const WORKSHOP_RADIUS =
100;


/* =====================================================
   ADMIN VARIABLES
===================================================== */

let bypassGps =
false;


let bypassTime =
false;


let bypassDevice =
false;


/* =====================================================
   ADMIN SECRET CLICK
===================================================== */

let secretClicks =
0;


let secretClickTimer =
null;


document
.getElementById("secretTrigger")
.addEventListener(
    "click",
    function() {

        secretClicks++;


        clearTimeout(
            secretClickTimer
        );


        secretClickTimer =
            setTimeout(
                function() {

                    secretClicks = 0;

                },
                1800
            );


        if (
            secretClicks >= 5
        ) {

            secretClicks = 0;

            openAdminLogin();

        }

    }
);


/* =====================================================
   ADMIN LOGIN
===================================================== */

function openAdminLogin() {

    document
    .getElementById(
        "adminLoginBox"
    )
    .classList
    .remove("hidden");


    document
    .getElementById(
        "adminPanel"
    )
    .classList
    .add("hidden");


    document
    .getElementById(
        "adminPassword"
    )
    .value = "";


    document
    .getElementById(
        "adminError"
    )
    .innerText = "";


    setTimeout(
        function() {

            document
            .getElementById(
                "adminPassword"
            )
            .focus();

        },
        100
    );

}


/* =====================================================
   VERIFY ADMIN
===================================================== */

function verifyAdmin() {

    const password =
        document
        .getElementById(
            "adminPassword"
        )
        .value
        .trim();


    const error =
        document
        .getElementById(
            "adminError"
        );


    if (!password) {

        error.innerText =
            "Please enter administrator password.";

        return;

    }


    if (
        password !==
        "ewL3nu8L"
    ) {

        error.innerText =
            "Incorrect administrator password.";

        return;

    }


    error.innerText =
        "";


    document
    .getElementById(
        "adminLoginBox"
    )
    .classList
    .add("hidden");


    document
    .getElementById(
        "adminPanel"
    )
    .classList
    .remove("hidden");

}


/* =====================================================
   ADMIN CHECKBOXES
===================================================== */

document
.getElementById("bypassGps")
.addEventListener(
    "change",
    function() {

        bypassGps =
            this.checked;

    }
);


document
.getElementById("bypassTime")
.addEventListener(
    "change",
    function() {

    }
);


document
.getElementById("bypassDevice")
.addEventListener(

    function() {

        bypassDevice =

    }
);


/* =====================================================
   RESET ADMIN
===================================================== */

function resetAdmin() {

    bypassGps = false;

    bypassTime = false;

    bypassDevice = false;


    document
    .getElementById("bypassGps")
    .checked = false;


    document
    .getElementById("bypassTime")
    .checked = false;


    document
    .getElementById("bypassDevice")

    document
    .getElementById("adminPanel")
    .classList
    .add("hidden");

}


/* =====================================================
   WORK LOCATION
===================================================== */

document
.getElementById("workLocation")
.addEventListener(
    "change",
    function() {

        const group =
            document.getElementById(
                "externalSiteGroup"
            );


        if (
            this.value ===
            "External Site"
        ) {

            group.style.display =

        }

        else {

            document
            .getElementById(

        }

    }
);


/* =====================================================
   STATUS
===================================================== */

function showStatus(
    message,
    type
) {

    const status =
        document.getElementById(
            "status"
        );


    status.innerText =
        message;


    status.className =
        "";


    if (
        type === "success"
    ) {

        status.classList.add(
            "status-success"
        );

    }

    else if (
        type === "error"
    ) {

        status.classList.add(
            "status-error"
        );

    }

    else {

        status.classList.add(
            "status-info"
        );

    }

}


/* =====================================================
   CAIRO TIME
===================================================== */

function getCairoTime() {

    const now =
        new Date();


    const parts =
        new Intl.DateTimeFormat(
            "en-GB",
            {

                timeZone:
                    "Africa/Cairo",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                second:
                    "2-digit",

                hourCycle:
                    "h23"

            }
        )
        .formatToParts(now);


    const result = {};


    parts.forEach(
        function(part) {

            if (
                part.type !==
                "literal"
            ) {

                result[
                    part.type
                ] =
                    part.value;

            }

        }
    );


    return {

        hour:
            Number(result.hour),

        minute:
            Number(result.minute),

        second:
            Number(result.second)

    };

}


/* =====================================================
   CAIRO DATE
===================================================== */

function getCairoDate() {

    return new Intl.DateTimeFormat(
        "en-GB",
        {

            timeZone:
                "Africa/Cairo",

            day:
                "2-digit",

            month:
                "2-digit",

            year:
                "numeric"

        }
    )
    .format(
        new Date()
    );

}


/* =====================================================
   CAIRO 12-HOUR TIME
===================================================== */

function getCairoDisplayTime() {

    return new Intl.DateTimeFormat(
        "en-US",
        {

            timeZone:
                "Africa/Cairo",

            hour:
                "numeric",

            minute:
                "2-digit",

            hour12:
                true

        }
    )
    .format(
        new Date()
    );

}


/* =====================================================
   CHECK TIME WINDOW
===================================================== */

function checkAttendanceTime() {

    if (
        bypassTime
    ) {

        return {
            allowed: true
        };

    }


    const time =
        getCairoTime();


    const currentMinutes =
        time.hour * 60 +
        time.minute;


    const startMinutes =
        5 * 60;


    const endMinutes =
        14 * 60;


    if (
        currentMinutes <
        startMinutes
        ||
        currentMinutes >=
        endMinutes
    ) {

        return {

            allowed:
                false,

            message:

                "Attendance is currently unavailable.\n\n" +

                "Allowed time: 05:00 AM - 02:00 PM\n\n" +

                "Current Cairo time: " +

                getCairoDisplayTime()

        };

    }


    return {
        allowed: true
    };

}


/* =====================================================
   DEVICE ID
===================================================== */

function getDeviceId() {

    let deviceId =
        localStorage.getItem(
            "attendance_device_id"
        );


    if (!deviceId) {

        deviceId =
            "DEV-" +
            Date.now() +
            "-" +
            Math.random()
            .toString(36)
            .substring(2,10);


        localStorage.setItem(
            "attendance_device_id",
            deviceId
        );

    }


    return deviceId;

}


/* =====================================================
   TODAY KEY
===================================================== */

function getTodayKey() {

    const parts =
        getCairoDate()
        .split("/");


    return (
        parts[2] +
        "-" +
        parts[1] +
        "-" +
        parts[0]
    );

}


/* =====================================================
   LOCAL DEVICE LOCK
===================================================== */

function checkLocalDeviceLock(
    employee
) {

    if (
        bypassDevice
    ) {

        return true;

    }


    const key =
        "attendance_used_" +
        getTodayKey();


    const existing =
        localStorage.getItem(
            key
        );


    if (!existing) {

        return true;

    }


    return (
        existing ===
        employee
    );

}


/* =====================================================
   SAVE DEVICE LOCK
===================================================== */

function saveLocalDeviceLock(
    employee
) {

    if (
        bypassDevice
    ) {

        return;

    }


    const key =
        "attendance_used_" +
        getTodayKey();


    localStorage.setItem(
        key,
        employee
    );

}


/* =====================================================
   DISTANCE
===================================================== */

function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R =
        6371000;


    const dLat =
        (
            lat2 - lat1
        )
        *
        Math.PI /
        180;


    const dLon =
        (
            lon2 - lon1
        )
        *
        Math.PI /
        180;


    const a =

        Math.sin(
            dLat / 2
        )
        *
        Math.sin(
            dLat / 2
        )

        +

        Math.cos(
            lat1 *
            Math.PI /
            180
        )
        *
        Math.cos(
            lat2 *
            Math.PI /
            180
        )
        *
        Math.sin(
            dLon / 2
        )
        *
        Math.sin(
            dLon / 2
        );


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );


    return R * c;

}


/* =====================================================
   GPS
===================================================== */

function getGPS() {

    return new Promise(
        function(
            resolve,
            reject
        ) {


            if (
                !navigator.geolocation
            ) {

                reject(
                    "Geolocation is not supported by this browser."
                );

                return;

            }


            navigator
            .geolocation
            .getCurrentPosition(

                function(position) {

                    resolve({

                        latitude:
                            position
                            .coords
                            .latitude,

                        longitude:
                            position
                            .coords
                            .longitude,

                        accuracy:
                            position
                            .coords
                            .accuracy

                    });

                },


                function(error) {

                    if (
                        error.code === 1
                    ) {

                        reject(
                            "Location permission was denied."
                        );

                    }

                    else if (
                        error.code === 2
                    ) {

                        reject(
                            "Your location is unavailable."
                        );

                    }

                    else if (
                        error.code === 3
                    ) {

                        reject(
                            "Location request timed out."
                        );

                    }

                    else {

                        reject(
                            "Unable to get your location."
                        );

                    }

                },


                {

                    enableHighAccuracy:
                        true,

                    timeout:
                        15000,

                    maximumAge:
                        0

                }

            );

        }
    );

}


/* =====================================================
   SEND DATA
===================================================== */

function sendData(
    payload
) {

    return fetch(

        SCRIPT_URL,

        {

            method:
                "POST",

            mode:
                "no-cors",

            headers: {

                "Content-Type":
                    "text/plain;charset=utf-8"

            },

            body:
                JSON.stringify(
                    payload
                )

        }

    );

}


/* =====================================================
   MAIN ATTENDANCE
===================================================== */

async function sendAttendance() {


    const employee =
        document
        .getElementById(
            "employee"
        )
        .value;


    const workLocation =
        document
        .getElementById(
            "workLocation"
        )
        .value;


    const externalSite =
        document
        .getElementById(
            "externalSite"
        )
        .value
        .trim();


    const submitBtn =
        document
        .getElementById(
            "submitBtn"
        );


    /* -----------------------------------------------
       EMPLOYEE
    ------------------------------------------------ */

    if (!employee) {

        showStatus(
            "Please select an employee.",
            "error"
        );

        return;

    }


    /* -----------------------------------------------
       EXTERNAL SITE
    ------------------------------------------------ */

    if (

        workLocation ===
        "External Site"

        &&

        !externalSite

    ) {

        showStatus(
            "Please enter the external site.",
            "error"
        );

        return;

    }


    /* -----------------------------------------------
       TIME CHECK
    ------------------------------------------------ */

    const timeCheck =
        checkAttendanceTime();


    if (
        !timeCheck.allowed
    ) {

        showStatus(
            timeCheck.message,
            "error"
        );

        return;

    }


    /* -----------------------------------------------
       DEVICE LOCK
    ------------------------------------------------ */

    if (
        !checkLocalDeviceLock(
            employee
        )
    ) {

        showStatus(

            "This device has already been used for another employee today.",

            "error"

        );

        return;

    }


    /* -----------------------------------------------
       BUTTON
    ------------------------------------------------ */

    submitBtn.disabled =
        true;


    submitBtn.innerText =
        "PROCESSING...";


    let latitude =
        null;


    let longitude =
        null;


    let accuracy =
        null;


    let gpsVerification =
        "Not Required";


    try {


        /* ===========================================
           EXTERNAL SITE
        ============================================ */

        if (
            workLocation ===
            "External Site"
        ) {

            gpsVerification =
                "Not Required";


        }


        /* ===========================================
           INSIDE WORKSHOP + GPS BYPASS
        ============================================ */

        else if (
            bypassGps
        ) {

            gpsVerification =
                "Bypassed by Admin";

        }


        /* ===========================================
           INSIDE WORKSHOP NORMAL
        ============================================ */

        else {


            showStatus(
                "Getting your location...",
                "info"
            );


            const location =
                await getGPS();


            latitude =
                location.latitude;


            longitude =
                location.longitude;


            accuracy =
                location.accuracy;


            const distance =
                calculateDistance(

                    WORKSHOP_LAT,

                    WORKSHOP_LNG,

                    latitude,

                    longitude

                );


            if (
                distance >
                WORKSHOP_RADIUS
            ) {

                throw new Error(

                    "You are outside the workshop radius.\n\n" +

                    "Distance: " +

                    Math.round(
                        distance
                    ) +

                    " meters\n\n" +

                    "Allowed radius: " +

                    WORKSHOP_RADIUS +

                    " meters."

                );

            }


            gpsVerification =

                "Verified - " +

                Math.round(
                    distance
                ) +

                " m";

        }


        /* ===========================================
           PAYLOAD
        ============================================ */

        const payload = {

            employee:
                employee,

            workLocation:
                workLocation,

            externalSite:
                externalSite,

            latitude:
                latitude,

            longitude:
                longitude,

            accuracy:
                accuracy,

            gpsVerification:
                gpsVerification,

            deviceId:
                getDeviceId(),

            bypassGps:
                bypassGps,

            bypassTime:
                bypassTime,

            bypassDevice:
                bypassDevice

        };


        /* ===========================================
           SEND
        ============================================ */

        showStatus(
            "Sending attendance...",
            "info"
        );


        await sendData(
            payload
        );


        /* ===========================================
           WAIT
        ============================================ */

        await new Promise(
            function(resolve) {

                setTimeout(
                    resolve,
                    1200
                );

            }
        );


        /* ===========================================
           SAVE DEVICE LOCK
        ============================================ */

        saveLocalDeviceLock(
            employee
        );


        /* ===========================================
           SUCCESS
        ============================================ */

        showStatus(
            "Attendance submitted successfully.",
            "success"
        );


        submitBtn.innerText =
            "ATTENDANCE SUBMITTED";


    }

    catch(error) {


        console.error(
            error
        );


        showStatus(

            error.message ||
            String(error),

            "error"

        );


        submitBtn.disabled =
            false;


        submitBtn.innerText =
            "SUBMIT ATTENDANCE";

    }

}
