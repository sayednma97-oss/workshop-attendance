<style>

    box-sizing: border-box;
}

body {
    margin: 0;

    font-family: Arial, Helvetica, sans-serif;

        radial-gradient(

/* =====================================================
   MAIN CONTAINER
===================================================== */

.container {

/* =====================================================
   SECRET ADMIN TRIGGER
===================================================== */

    position: absolute;

    top: 8px;
    right: 8px;

    width: 38px;
    height: 38px;

    background: transparent;

    opacity: 0;

    cursor: default;

/* =====================================================

===================================================== */

}

label {

    color: #cbd5df;

    font-size: 14px;

    font-weight: 600;
}


select,
input[type="text"],
input[type="password"] {

    padding: 14px 15px;

    border-radius: 13px;

    border: 1px solid rgba(255,255,255,0.09);

    background: rgba(255,255,255,0.055);

    color: #ffffff;

    outline: none;

    font-size: 15px;

    transition: 0.2s;

select:focus,
input[type="text"]:focus,
input[type="password"]:focus {

    background: rgba(255,255,255,0.075);

select option {

===================================================== */

===================================================== */

===================================================== */

#status {

/* =====================================================

) {

    status.className =

        type ===

    else if (

/* =====================================================
   DEVICE ID
===================================================== */

function getDeviceId() {

    let deviceId =
        localStorage.getItem(
            "attendance_device_id"
        );


    if (!deviceId) {

        deviceId =
            "DEV-" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .substring(2, 10);


        localStorage.setItem(
            "attendance_device_id",
            deviceId
        );

    }


    return deviceId;

}


/* =====================================================
   TODAY KEY
===================================================== */

function getTodayKey() {

    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        String(
            now.getMonth() + 1
        )
        .padStart(2, "0");


    const day =
        String(
            now.getDate()
        )
        .padStart(2, "0");


    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}

) {

/* =====================================================
   DISTANCE
===================================================== */

function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R =
        6371000;


    const dLat =
        (
            lat2 - lat1
        )
        *
        Math.PI /
        180;


    const dLon =
        (
            lon2 - lon1
        )
        *
        Math.PI /
        180;


    const a =

        Math.sin(
            dLat / 2
        )
        *
        Math.sin(
            dLat / 2
        )

        +

        Math.cos(
            lat1 *
            Math.PI /
            180
        )

        *

        Math.cos(
            lat2 *
            Math.PI /
            180
        )

        *

        Math.sin(
            dLon / 2
        )
        *
        Math.sin(
            dLon / 2
        );


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );


    return R * c;

}


/* =====================================================
   GPS
===================================================== */

function getGPS() {

    return new Promise(
        function (
            resolve,
            reject
        ) {


            if (
                !navigator.geolocation
            ) {

                reject(
                    "Geolocation is not supported by this browser."
                );

                return;

            }


            navigator.geolocation.getCurrentPosition(

                function (
                    position
                ) {

                    resolve({

                        latitude:
                            position
                            .coords
                            .latitude,

                        longitude:
                            position
                            .coords
                            .longitude,

                        accuracy:
                            position
                            .coords
                            .accuracy

                    });

                },


                function (
                    error
                ) {

                    let message =
                        "Unable to get your location.";


                    if (
                        error.code ===
                        1
                    ) {

                        message =
                            "Location permission was denied.";

                    }

                    else if (
                        error.code ===
                        2
                    ) {

                        message =
                            "Your location is unavailable.";

                    }

                    else if (
                        error.code ===
                        3
                    ) {

                        message =
                            "Location request timed out.";

                    }


                    reject(
                        message
                    );

                },


                {

                    enableHighAccuracy:
                        true,

                    timeout:
                        15000,

                    maximumAge:
                        0

                }

            );

        }
    );

}

}

    if (!workLocation) {

        );

        return;

    }


    if (
        workLocation ===
        "External Site"
        &&
        !externalSite
    ) {

        showStatus(
            "Please enter the external site.",
            "error"
        );

        return;

    }


    /* -----------------------------------------------
       DEVICE LOCK
    ------------------------------------------------ */

    if (
        !checkLocalDeviceLock(
            employee
        )
    ) {

        showStatus(

            "This device has already been used for another employee today.",

            "error"

        );

        return;

    }


    /* -----------------------------------------------
       DISABLE BUTTON
    ------------------------------------------------ */

    submitBtn.disabled =
        true;


    submitBtn.innerText =
        "PROCESSING...";


    showStatus(
        "Processing attendance...",
        "info"
    );


    try {


        let latitude =
            null;


        let longitude =
            null;


        let accuracy =
            null;


        /* -------------------------------------------
           GPS LOGIC
        -------------------------------------------- */


        const needsGPS =

            workLocation ===
            "Inside Workshop"

            &&

            !bypassGps;


        /*
         * External Site:
         * NO GPS
         *
         * Inside Workshop + GPS bypass:
         * NO GPS
         *
         * Inside Workshop normal:
         * GPS REQUIRED
         */


        if (needsGPS) {


            showStatus(
                "Getting your location...",
                "info"
            );


            const location =
                await getGPS();


            latitude =
                location.latitude;


            longitude =
                location.longitude;


            accuracy =
                location.accuracy;


            /* ---------------------------------------
               CLIENT DISTANCE
            ---------------------------------------- */

            const distance =
                calculateDistance(

                    WORKSHOP_LAT,

                    WORKSHOP_LNG,

                    latitude,

                    longitude

                );


            if (
                distance >
                WORKSHOP_RADIUS
            ) {

                throw new Error(

                    "You are outside the workshop radius. " +

                    "Distance: " +

                    Math.round(
                        distance
                    ) +

                    " meters."

                );

            }

        }


        /* -------------------------------------------
           PAYLOAD
        -------------------------------------------- */

        const payload = {

            employee:
                employee,

            workLocation:
                workLocation,

            externalSite:
                externalSite,

            latitude:
                latitude,

            longitude:
                longitude,

            accuracy:
                accuracy,

            deviceId:
                getDeviceId(),

            bypassGps:
                bypassGps,

            bypassTime:
                bypassTime,

            bypassDevice:
                bypassDevice,

            clientTime:
                new Date()
                .toISOString()

        };


        /* -------------------------------------------
           SEND
        -------------------------------------------- */

        showStatus(
            "Sending attendance...",
            "info"
        );


        await sendData(
            payload
        );


        /*
         * no-cors does not allow us to read
         * the Apps Script response.
         *
         * Wait briefly for the request.
         */


        await new Promise(
            function(resolve) {

                setTimeout(
                    resolve,
                    1200
                );

            }
        );


        /* -------------------------------------------
           SAVE LOCAL LOCK
        -------------------------------------------- */

        saveLocalDeviceLock(
            employee
        );


        /* -------------------------------------------
           SUCCESS
        -------------------------------------------- */

        showStatus(

            "Attendance submitted successfully.",

            "success"

        );


        submitBtn.innerText =
            "ATTENDANCE SUBMITTED";


    }

    catch (error) {


        console.error(
            error
        );


        showStatus(

            error.message ||
            String(error),

            "error"

        );


        submitBtn.disabled =
            false;


        submitBtn.innerText =
            "SUBMIT ATTENDANCE";

    }

}


/* =====================================================
   ADMIN ENTER KEY
===================================================== */

document
.getElementById(
    "adminPassword"
)
.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            verifyAdmin();

        }

    }
);


</script>
